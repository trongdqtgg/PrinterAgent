<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HIS Print Preview Pro</title><link rel="stylesheet" href="style.css"></head><body><main>
<header><div class="logo">P</div><div><h1>HIS Print Preview Pro</h1><p>Nhận PDF/HTML từ HIS · cấu hình · xem trước · xác nhận in · <span id="version">v...</span></p></div><button id="update" class="soft">Kiểm tra cập nhật</button></header>
<div class="layout"><aside>
<section class="card"><label>Máy in</label><div class="row"><select id="printer"></select><button id="refresh" class="icon">↻</button></div><small id="printerState"></small></section>
<section class="card"><label>Tài liệu PDF / HTML</label><div id="fileDrop" class="drop" tabindex="0"><input id="fileInput" type="file" accept=".pdf,.html,.htm" hidden><div id="emptyFile"><b>📁 Kéo thả file vào đây</b><small>hoặc bấm để chọn file</small></div><div id="fileChip" class="file-chip" hidden><span id="fileIcon">📄</span><div><b id="fileName"></b><small id="fileMeta"></small></div><button id="removeFile" class="remove">×</button></div></div></section>
<section class="card settings"><div><label>Khổ giấy</label><select id="pageSize"><option>A4</option><option>A5</option><option>Letter</option></select></div><div><label>Hướng giấy</label><select id="landscape"><option value="false">Dọc (Portrait)</option><option value="true">Ngang (Landscape)</option></select></div><div><label>Chọn trang</label><select id="pageMode"><option value="all">Tất cả trang</option><option value="odd">Trang lẻ</option><option value="even">Trang chẵn</option><option value="custom">Tùy chỉnh</option></select></div><div id="customWrap" hidden><label>Khoảng trang</label><input id="customRange" placeholder="VD: 1-3, 5, 7"></div><div><label>Tỷ lệ (%)</label><input id="scale" type="number" min="50" max="200" value="100"></div><div><label>Số bản</label><input id="copies" type="number" min="1" max="99" value="1"></div></section>
<button id="previewButton" class="full" disabled>Xem trước thực tế (PDF)</button><button id="print" class="full print" disabled>In ngay (Silent Print)</button><div id="printHint" hidden>⚠ Cấu hình đã thay đổi — cần xem trước lại trước khi in.</div><button id="cancel" class="full cancel" disabled>Hủy tài liệu</button>
</aside><section class="preview card"><div class="preview-head"><div><h2>Khung xem trước tài liệu</h2><small id="previewHint">Chưa có tài liệu</small></div><span class="badge">Bản in thực tế</span></div><iframe id="docPreview"></iframe></section></div><div id="status"></div><div id="updateStatus"></div>
</main><script src="renderer.js"></script></body></html>
