<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HIS Print Preview Pro</title><link rel="stylesheet" href="style.css"></head><body><main>
<div class="layout"><aside>
<section class="card printer-card"><label>Máy in</label><div class="row"><select id="printer"></select><button id="refresh" class="icon">↻</button></div><small id="printerState"></small></section>
<section class="card settings"><div><label>Khổ giấy</label><select id="pageSize"><option>A4</option><option>A5</option><option>Letter</option></select></div><div><label>Hướng giấy</label><select id="landscape"><option value="false">Dọc (Portrait)</option><option value="true">Ngang (Landscape)</option></select></div><div><label>Chọn trang</label><select id="pageMode"><option value="all">Tất cả trang</option><option value="odd">Trang lẻ (Reverse bắt buộc)</option><option value="even">Trang chẵn</option><option value="custom">Tùy chỉnh</option></select></div><div id="customWrap" hidden><label>Khoảng trang</label><input id="customRange" placeholder="VD: 1-3, 5, 7"></div><div><label>Tỷ lệ (%)</label><div class="scale-row"><button id="scaleDown" title="Giảm 3%, xem trước và cho phép in (F3)">−3% <kbd>F3</kbd></button><input id="scale" type="number" min="50" max="200" value="95"><button id="scaleUp" title="Tăng 3%, xem trước và cho phép in (F4)">+3% <kbd>F4</kbd></button></div></div><div><label>Số bản</label><input id="copies" type="number" min="1" max="99" value="1"></div><div id="duplexWrap" class="duplex-setting"><label>In hai mặt</label><select id="duplexMode"><option value="simplex">Một mặt</option><option value="duplexlong">Hai mặt — lật cạnh dài</option><option value="duplexshort">Hai mặt — lật cạnh ngắn</option></select><small id="duplexStatus">Đang kiểm tra máy in...</small></div></section>
<div class="action-row"><button id="previewButton" class="action preview-action" disabled title="Xem trước (F1)">👁️ <span>Xem trước</span><kbd>F1</kbd></button><button id="print" class="action print" disabled title="In ngay (F2)">🖨️ <span>In ngay</span><kbd>F2</kbd></button><button id="exitForm" class="action cancel" title="Thoát form (Esc)">🚪 <span>Thoát</span><kbd>Esc</kbd></button></div><div id="printHint" hidden>⚠ Cấu hình đã thay đổi — cần xem trước lại trước khi in.</div>
<section class="card templates template-panel"><div class="template-title"><div><h2>Lưu và chọn mẫu cấu hình</h2><small id="version">v...</small></div><button id="update" class="update-small">Kiểm tra cập nhật</button></div><div class="template-grid"><div><label>Mẫu đang chọn</label><input id="selectedTemplate" readonly placeholder="Chưa chọn mẫu"></div><div><label>Tìm và chọn mẫu</label><input id="templateSearch" list="templateList" placeholder="Gõ hoặc bấm để xem toàn bộ mẫu..."><datalist id="templateList"></datalist></div><div><label>Tên mẫu mới</label><input id="newTemplateName" placeholder="Nhập tên để thêm mẫu"></div><div><label>Hotkey (không bắt buộc)</label><select id="templateHotkey"><option value="">Không gán</option><option>F5</option><option>F6</option><option>F7</option><option>F8</option><option>F9</option><option>F10</option><option>F11</option><option>F12</option></select></div></div><div class="template-actions"><button id="saveTemplate" class="soft">Thêm mẫu</button><button id="deleteTemplate" class="delete-template" disabled>Xóa mẫu</button></div><small>Mẫu dùng F5–F12; F1 xem trước, F2 in, F3/F4 chỉnh tỷ lệ và Esc thoát.</small><div id="templateStatus" class="template-status" aria-live="polite"></div></section>
<section class="card document-panel"><label>Tài liệu PDF / HTML</label><div id="fileDrop" class="drop" tabindex="0"><input id="fileInput" type="file" accept=".pdf,.html,.htm" hidden><div id="emptyFile"><b>📁 Kéo thả file vào đây</b><small>hoặc bấm để chọn file</small></div><div id="fileChip" class="file-chip" hidden><span id="fileIcon">📄</span><div><b id="fileName"></b><small id="fileMeta"></small></div><button id="removeFile" class="remove">×</button></div></div></section>
</aside><div class="preview-column"><section class="preview card"><div class="preview-head"><div><h2>Khung xem trước tài liệu</h2><small id="previewHint">Chưa có tài liệu</small></div><div class="preview-tools"><span class="badge">Bản in thực tế</span><button id="exportPdf" class="export-pdf" disabled title="Lưu bản PDF đang xem">⬇️ Xuất PDF</button></div></div><div id="status" aria-live="polite"></div><iframe id="docPreview"></iframe></section></div></div><div id="updateStatus"></div>
</main><script src="renderer.js"></script></body></html>
